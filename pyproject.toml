[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2", "wheel"]
build-backend = "setuptools.build_meta"

###############################################################################
# Project
###############################################################################
[project]
name = "spgrep_modulation"
dynamic = ["version"]
description = "Collective atomic modulation analysis with irreducible space-group representation"
readme = "README.md"
authors = [
    {name = "Kohei Shinohara", email = "kshinohara0508@gmail.com"},
]
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
    # Full list: https://pypi.python.org/pypi?%3Aaction=list_classifiers
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "setuptools",
    "setuptools_scm",
    "wheel",
    "typing_extensions",
    "numpy>=1.20.1",
    "spglib>=2.6",
    "phonopy>=2.43.1",
    "seekpath",
    "spgrep>=0.4",
    "hsnf>=0.3.15",  # https://github.com/lan496/hsnf
]

[project.urls]
repository = "https://github.com/lan496/spgrep-modulation"
homepage = "https://phonopy.github.io/spgrep-modulation"
documentation = "https://phonopy.github.io/spgrep-modulation"
changelog = "https://phonopy.github.io/spgrep-modulation/changelog.html"

[project.optional-dependencies]
vis = [
    "ipykernel",
    "notebook>=4.2",
    "ipywidgets",
    "nglview>=3.0.4",
    "ase>=3.23",
    "pymatgen>=2022.8.23",
]
dev = [
    "pytest",
    "pytest-cov",
    "pre-commit",
    "black",
    "mypy",
    "flake8",
    "pyupgrade",
    "ipython",
    "click",
    "networkx",
]
docs = [
    "docutils>=0.20",
    "sphinx",
    "sphinx-autobuild",
    "nbsphinx",
    "sphinxcontrib-bibtex",
    # "sphinx-proof",  # Seems to be incompatible with nbsphinx
    "myst-parser",
    "sphinx-book-theme",
]

[dependency-groups]
dev = [ "spgrep-modulation[dev]" ]

###############################################################################
# Setuptools
###############################################################################
[tool.setuptools]
zip-safe = false

###############################################################################
# Other tools
###############################################################################

# Enable version inference
[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
[tool.ruff.lint]
extend-select = [
    "F",           # pyflakes
    "E",           # pycodestyle-errors
    "I",           # isort
    # "D",           # pydocstyle
    "UP",          # pyupgrade
]
extend-ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D203",  # Conflict with D211
    "D205",
    "D213",  # Conflict with D212
    "E501",
]

[tool.mypy]
exclude = [
    'docs',
]
warn_no_return = false
